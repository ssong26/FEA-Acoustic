name: MATLAB checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-tests:
    name: Run solver checks in MATLAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      - name: Run tests
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath('src');
            addpath('examples');
            addpath('tests');
            run_tests
